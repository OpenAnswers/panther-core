services:
  mongodb:
    image: mongo:7.0.28
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    expose:
      - '27017'
    ports:
      - 27017:27017

  event-console:
    image: event-console
    container_name: event-console
    hostname: console
    restart: unless-stopped
    env_file: .env
    # Optional runtime plugin install. Useful when testing the same flow as the
    # stock DockerHub images instead of baking plugins into your custom image.
    # environment:
    #   - PANTHER_PLUGIN_INSTALL=["file:/plugins/panther-plugin-sso"]
    #   - PANTHER_PLUGIN_DIR=/tmp/panther-plugins
    depends_on:
      - mongodb
    expose:
      - 3001
    ports:
      - 3001:3001
    links:
      - mongodb
    volumes:
      - rules-vol:/app/rules:rw
      # Optional plugin/config mount. The plugin path above is resolved inside
      # the container, not relative to this compose file.
      # - ./plugins:/plugins:ro

  event-server:
    image: event-server
    container_name: event-server
    hostname: server
    restart: unless-stopped
    expose:
      - 4002
    env_file: .env
    # Add the same install target here when the plugin also implements
    # applyServer() or is otherwise needed by the event-server process.
    # environment:
    #   - PANTHER_PLUGIN_INSTALL=["file:/plugins/panther-plugin-sso"]
    #   - PANTHER_PLUGIN_DIR=/tmp/panther-plugins
    depends_on:
      - mongodb
    links:
      - mongodb
    volumes:
      - rules-vol:/app/rules:ro
      # Optional plugin/config mount shared with event-console.
      # - ./plugins:/plugins:ro

  event-monitors-http:
    image: event-monitors
    container_name: event-monitors-http
    hostname: event-monitors-http
    restart: unless-stopped
    ports:
      - '5001:5001'
    env_file: .env
    command: http
    depends_on:
      - event-console
      - event-server
    volumes:
      - rules-vol:/app/rules:ro

  event-monitors-syslogd:
    image: event-monitors
    container_name: event-monitors-syslogd
    hostname: event-monitors-syslogd
    restart: unless-stopped
    ports:
      - '1514:1514'
    env_file: .env
    command: syslogd
    depends_on:
      - event-console
      - event-server
    volumes:
      - rules-vol:/app/rules:ro

volumes:
  rules-vol:
